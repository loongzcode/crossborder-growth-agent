services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: crossborder
      POSTGRES_USER: crossborder
      POSTGRES_PASSWORD: crossborder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crossborder -d crossborder"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://crossborder:crossborder@postgres:5432/crossborder
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3006
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
