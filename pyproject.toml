[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "crossborder-growth-agent"
version = "0.1.0"
description = "跨境电商多 Agent 经营决策系统"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Proprietary" }
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "openpyxl>=3.1,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "structlog>=24.4,<27",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = [
  "apps/api/src/crossborder_api",
  "packages/analytics/src/crossborder_analytics",
  "packages/connectors/src/crossborder_connectors",
  "packages/domain/src/crossborder_domain",
  "packages/persistence/src/crossborder_persistence",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
  "apps/api/src",
  "packages/analytics/src",
  "packages/connectors/src",
  "packages/domain/src",
  "packages/persistence/src",
  "tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
allowed-confusables = ["，", "。", "："]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
packages = [
  "crossborder_api",
  "crossborder_analytics",
  "crossborder_connectors",
  "crossborder_domain",
  "crossborder_persistence",
]
mypy_path = [
  "apps/api/src",
  "packages/analytics/src",
  "packages/connectors/src",
  "packages/domain/src",
  "packages/persistence/src",
]

[[tool.mypy.overrides]]
module = ["uvicorn.*"]
ignore_missing_imports = true
